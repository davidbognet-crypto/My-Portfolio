<main id="main">
<section class="block narrow">
  <h1>Academic planner</h1>
  <p>Add your study tasks, tick them off, and delete them. Tasks stay saved in this browser.</p>
  <form id="task-form" novalidate>
    <label for="task-input">New task</label>
    <div class="row"><input id="task-input" type="text" placeholder="e.g. Finish COS 106 term project" maxlength="100"><button class="btn" type="submit">Add task</button></div>
    <p id="task-error" class="error" role="alert"></p>
  </form>
  <p id="task-count" class="small" aria-live="polite"></p>
  <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
  <div class="filters" id="filters" role="group" aria-label="Filter tasks">
    <button type="button" data-filter="all" class="active">All</button>
    <button type="button" data-filter="pending">Pending</button>
    <button type="button" data-filter="done">Completed</button>
  </div>
  <ul id="task-list" class="tasks"></ul>
  <button id="clear-done" class="btn btn-outline" type="button">Clear completed</button>
</section>
</main>
