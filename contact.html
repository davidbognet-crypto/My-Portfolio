<section class="block narrow">
  <h1>Contact me</h1>
  <p>Email: <a href="mailto:davidbognet@gmail.com">davidbognet@gmail.com</a> &middot; Phone: 0913 810 1852</p>
  <form id="contact-form" novalidate>
    <label for="name">Name</label><input id="name" type="text" autocomplete="name"><p class="error" id="name-error"></p>
    <label for="email">Email address</label><input id="email" type="email" autocomplete="email"><p class="error" id="email-error"></p>
    <label for="phone">Phone number</label><input id="phone" type="tel" autocomplete="tel" inputmode="numeric"><p class="hint">Digits only, for example 08012345678.</p><p class="error" id="phone-error"></p>
    <label for="message">Message</label><textarea id="message" rows="5" maxlength="500"></textarea><p class="char-count" id="char-count">0 / 500</p><p class="error" id="message-error"></p>
    <button class="btn" type="submit">Send message</button>
    <p id="form-success" class="success" role="status"></p>
  </form>
</section>
